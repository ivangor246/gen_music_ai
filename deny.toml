[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
include-dev = true
unused-allowed-license = "warn"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
    { allow = ["LGPL-2.1"], crate = "oxisynth@0.1.0" },
    { allow = ["LGPL-2.1"], crate = "oxisynth-chorus@0.1.0" },
    { allow = ["LGPL-2.1"], crate = "oxisynth-reverb@0.1.0" },
]
