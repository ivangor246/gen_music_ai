name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Match tag to package version
        if: github.event_name == 'push'
        run: bash scripts/check-release-tag.sh "${GITHUB_REF_NAME}"

      - name: Export package version
        id: version
        run: echo "value=$(bash scripts/package-version.sh)" >>"${GITHUB_OUTPUT}"

  binaries:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: gen_music_ai
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: gen_music_ai.exe
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: gen_music_ai

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libasound2-dev

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Download verified runtime assets
        shell: bash
        run: bash scripts/download-assets.sh

      - name: Build embedded release binary
        shell: bash
        run: cargo build --release --locked --features embed --target "${{ matrix.target }}"

      - name: Package binary and licensing materials
        shell: bash
        run: |
          bash scripts/package-binary-release.sh \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "${{ needs.validate.outputs.version }}" \
            "${{ matrix.target }}" \
            dist

      - name: Upload binary archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  source:
    name: Package corresponding source
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package source and required third-party sources
        run: |
          bash scripts/package-source-release.sh \
            "${{ needs.validate.outputs.version }}" \
            dist

      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  verify:
    name: Verify release artifacts
    needs:
      - binaries
      - source
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify SHA-256 checksums
        working-directory: dist
        run: sha256sum --check -- *.sha256

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/*.sha256 \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag
