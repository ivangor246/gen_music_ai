[package]
name = "gen_music_ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Desktop application for local multi-instrument music generation and MIDI/WAV export"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ivangor246/gen_music_ai"
homepage = "https://github.com/ivangor246/gen_music_ai"
keywords = ["midi", "music-generation", "audio", "desktop"]
categories = ["multimedia::audio"]
publish = false
autotests = false
autobenches = false
autoexamples = false

[features]
# Release builds embed only the 49MB SoundFont. Model checkpoints are always
# downloaded independently into the platform-specific application data directory.
default = []
embed-soundfont = []

[lib]
path = "src/lib.rs"
doctest = false
bench = false

[[bin]]
name = "gen_music_ai"
path = "src/main.rs"
test = false
bench = false

[[test]]
name = "midi_export"
path = "tests/midi_export.rs"

[[test]]
name = "timeline"
path = "tests/timeline.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
candle-core = "0.9"
candle-nn = "0.9"
half = "2"
safetensors = "0.4"
rand = "0.8"
rand_chacha = "0.3"
# Candle's CPU matmul dispatches onto the global rayon pool; we size that pool.
rayon = "1"
hound = "3.5.1"
cpal = "0.18.1"
# sf3: the bundled soundfont uses Ogg/Vorbis-compressed samples (SF3).
# i16-out: render directly to interleaved i16.
oxisynth = { version = "0.1.0", features = ["sf3", "i16-out"] }
iced = { version = "0.13", features = ["canvas", "tokio"] }
directories = "6.0.0"
rfd = "0.17.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
sha2 = "0.11"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

# Dependencies are rebuilt from bitcode by fat LTO anyway, so splitting them
# into one codegen unit each only makes the build slower and far more memory
# hungry -- enough to matter on a machine that is already short on RAM.
[profile.release.package."*"]
codegen-units = 16

[profile.dev]
debug = 0

# The bundled SoundFont stores its samples as Ogg/Vorbis (SF3), and decoding
# them unoptimized takes minutes rather than seconds -- long enough that audio
# looks broken in development builds. Optimize just the decoding path.
[profile.dev.package]
byteorder = { opt-level = 3 }
lewton = { opt-level = 3 }
ogg = { opt-level = 3 }
oxisynth = { opt-level = 3 }
soundfont = { opt-level = 3 }
tinyvec = { opt-level = 3 }

[profile.test]
debug = 0
incremental = false
