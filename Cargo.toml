[package]
name = "gen_music_ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Desktop application for local multi-instrument music generation and MIDI/WAV export"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ivangor246/gen_music_ai"
homepage = "https://github.com/ivangor246/gen_music_ai"
keywords = ["midi", "music-generation", "audio", "desktop"]
categories = ["multimedia::audio"]
publish = false

[features]
# `embed` bakes the 447MB model and 49MB soundfont into the binary via include_bytes!.
# Off by default so dev builds stay fast (assets are read from the repo at runtime);
# release builds enable it for a single self-contained binary.
default = []
embed = []
# Enables tests that load the model weights or soundfont at runtime.
heavy-tests = []

[[test]]
name = "generation"
path = "tests/generation.rs"
required-features = ["heavy-tests"]

[[test]]
name = "parity"
path = "tests/parity.rs"
required-features = ["heavy-tests"]

[[test]]
name = "wav_export"
path = "tests/wav_export.rs"
required-features = ["heavy-tests"]

[[test]]
name = "bench_gen"
path = "tests/bench_gen.rs"
required-features = ["heavy-tests"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
candle-core = "0.9"
candle-nn = "0.9"
half = "2"
safetensors = "0.4"
rand = "0.8"
rand_chacha = "0.3"
# Candle's CPU matmul dispatches onto the global rayon pool; we size that pool.
rayon = "1"
hound = "3.5.1"
cpal = "0.18.1"
# sf3: the bundled soundfont uses Ogg/Vorbis-compressed samples (SF3).
# i16-out: render directly to interleaved i16.
oxisynth = { version = "0.1.0", features = ["sf3", "i16-out"] }
iced = { version = "0.13", features = ["canvas", "tokio"] }
directories = "6.0.0"
rfd = "0.17.2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

# Dependencies are rebuilt from bitcode by fat LTO anyway, so splitting them
# into one codegen unit each only makes the build slower and far more memory
# hungry -- enough to matter on a machine that is already short on RAM.
[profile.release.package."*"]
codegen-units = 16

# `cargo test --release` builds with this profile. It inherits from `release`,
# whose fat LTO and single codegen unit need several GB of RAM to link -- enough
# to push a small machine into swap while building the heavy tests. Tests only
# need the optimization, not the link-time work, so both are turned back off.
[profile.bench]
lto = false
codegen-units = 16
